version: '3.9'
services:
    frontend:
        build:
            context: .
        ports:
            - '80:80'
        restart: always

    dev:
        image: node:18-alpine
        working_dir: /app
        volumes:
            - .:/app
        environment:
            - REACT_APP_API_URL=http://localhost:3000
        ports:
            - '3000:3000'
        command: npm start
